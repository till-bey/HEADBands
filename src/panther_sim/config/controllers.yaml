# Controller names match the robot (see docs/ros2/README.md) so commands carry over.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dual_arm_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    left_arm_joint_trajectory_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_joint_trajectory_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    head_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    # Sim only, for rqt: switch it in for head_forward_position_controller, as for the arms.
    head_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # Robot names, but trajectory controllers: robot_topics serves the robot's lift and gripper topics through them
    # (the robot's controllers are vendor plugins, not available here).
    lifting_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_unix_gripper3_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_unix_gripper3_controller:
      type: joint_trajectory_controller/JointTrajectoryController

dual_arm_forward_position_controller:
  ros__parameters:
    joints: [joint_la0, joint_la1, joint_la2, joint_la3, joint_la4, joint_la5, joint_la6, joint_la7,
             joint_ra0, joint_ra1, joint_ra2, joint_ra3, joint_ra4, joint_ra5, joint_ra6, joint_ra7]
    interface_name: position

left_arm_joint_trajectory_position_controller:
  ros__parameters:
    joints: [joint_la0, joint_la1, joint_la2, joint_la3, joint_la4, joint_la5, joint_la6, joint_la7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_arm_joint_trajectory_position_controller:
  ros__parameters:
    joints: [joint_ra0, joint_ra1, joint_ra2, joint_ra3, joint_ra4, joint_ra5, joint_ra6, joint_ra7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

head_forward_position_controller:
  ros__parameters:
    joints: [joint_head0, joint_head1]
    interface_name: position

head_joint_trajectory_controller:
  ros__parameters:
    joints: [joint_head0, joint_head1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

lifting_controller:
  ros__parameters:
    joints: [body_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

left_unix_gripper3_controller:
  ros__parameters:
    joints: [joint_lf]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_unix_gripper3_controller:
  ros__parameters:
    joints: [joint_rf]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
