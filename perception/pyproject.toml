[project]
name = "perception"
version = "0.1.0"
description = "Frisbee detection: OpenCV detector, Streamlit site, YOLO training (ml group)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "pillow>=10,<13",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8"]
ml = [
    "ultralytics>=8.4.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "roboflow>=1.1.0",
    "matplotlib>=3.8.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "PyYAML>=6.0",
]

[tool.uv]
package = false
